[package]
name = "rusty-nmos6502"
version = "0.1.1"
edition = "2021"
description = "Cycle-perfect NMOS 6502 CPU emulator — declarative micro-op execution"
license = "GPL-3.0-only"
readme = "README.md"
homepage = "https://github.com/sjbtimdan/rusty-vic20/tree/main/nmos6502"
repository = "https://github.com/sjbtimdan/rusty-vic20"
keywords = ["6502", "cpu", "emulator", "nmos", "vic20"]
categories = ["emulators"]
rust-version = "1.70"
exclude = ["external/6502/"]

[dependencies]
paste = "1"

[target.'cfg(unix)'.dependencies]
sigpipe = "0.1.3"

[dev-dependencies]
rstest = "0.26.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nmos6502"

[[bin]]
name = "disassembler"
path = "src/bin/disassembler.rs"

[[bench]]
name = "cpu_bench"
harness = true
